services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: cinematch_postgres
    environment:
      POSTGRES_DB: cinematch
      POSTGRES_USER: cinematch
      POSTGRES_PASSWORD: Cinematch1234!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinematch -d cinematch"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: